name: Fishing v3 regression
on:
  push:
    branches: [feat/mobile-fishing-v3-phased, feat/fishing-v3-hires-art]
  workflow_dispatch:
jobs:
  node-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check game modules
        run: |
          for file in src/main.js src/scenes/*.js src/models/*.js src/utils/*.js src/data/*.js; do
            node --experimental-default-type=module --check "$file" || exit 1
          done
      - name: Run regression tests
        run: node --experimental-default-type=module --test tests/*.test.mjs

  phone-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run 390px mobile browser smoke test
        run: |
          python3 -m http.server 4187 --bind 127.0.0.1 >/tmp/fishing-http.log 2>&1 &
          server=$!
          trap "kill $server || true" EXIT
          node tools/smoke_test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishing-mobile-screenshots
          path: test-output/
          if-no-files-found: ignore

  asset-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python3 -m pip install "Pillow>=11,<13"
      - name: Audit and test PNG resolution (read-only)
        run: |
          python3 -m unittest discover -s tools -p 'test_asset_pipeline.py' -v
          npm run audit:fish-assets
          python3 tools/audit_scene_assets.py
          python3 tools/render_art_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishing-asset-audit
          path: |
            reports/fish_asset_*
            reports/scene_asset_*
            reports/fish_art_review.png
          if-no-files-found: ignore

  asset-normalize:
    # Only validated sources are eligible for modification; no work on main.
    needs: [node-regression, phone-smoke, asset-audit]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/mobile-fishing-v3-phased'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python3 -m pip install "Pillow>=11,<13"
      - name: Normalize only oversized PNGs that retain effective pixel density
        run: |
          python3 -m unittest discover -s tools -p 'test_asset_pipeline.py'
          npm run normalize:fish-assets
          python3 tools/audit_fish_assets.py
          python3 tools/audit_scene_assets.py
      - name: Test normalized images in a phone-sized browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 -m http.server 4187 --bind 127.0.0.1 >/tmp/fishing-http.log 2>&1 &
          server=$!
          trap "kill $server || true" EXIT
          node tools/smoke_test.cjs
      - name: Save image normalization as its own rollback commit
        run: |
          if git diff --quiet -- assets/images; then
            echo "No image qualifies for safe downsampling."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/images
            git diff --cached --check
            git commit -m "Phase 7a: downsample oversized fish PNGs with detail safety gate"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishing-normalized-audit
          path: |
            reports/fish_asset_*
            reports/scene_asset_*
            test-output/
          if-no-files-found: ignore
